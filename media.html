<!-- =========================
     FULLSCREEN IMAGE
========================= -->

<div class="media-lightbox" id="mediaLightbox">

    <button
        class="media-lightbox-close"
        id="mediaLightboxClose"
        type="button"
    >
        ×
    </button>


    <div class="media-lightbox-inner">

        <img
            id="mediaLightboxImage"
            src=""
            alt=""
        >

    </div>

</div>



<!-- =========================
     SCRIPT
========================= -->

<script>

    const mediaPhotos =
        document.querySelectorAll(".media-photo");

    const mediaLightbox =
        document.getElementById("mediaLightbox");

    const mediaLightboxImage =
        document.getElementById("mediaLightboxImage");

    const mediaClose =
        document.getElementById("mediaLightboxClose");


    mediaPhotos.forEach(photo => {

        photo.addEventListener("click", () => {

            const image =
                photo.getAttribute("data-image");

            mediaLightboxImage.src = image;

            mediaLightbox.classList.add("open");

            document.body.style.overflow = "hidden";

        });

    });


    mediaClose.addEventListener("click", () => {

        mediaLightbox.classList.remove("open");

        document.body.style.overflow = "";

    });


    mediaLightbox.addEventListener("click", event => {

        if (event.target === mediaLightbox) {

            mediaLightbox.classList.remove("open");

            document.body.style.overflow = "";

        }

    });


    document.addEventListener("keydown", event => {

        if (event.key === "Escape") {

            mediaLightbox.classList.remove("open");

            document.body.style.overflow = "";

        }

    });

</script>
